# 전체 파이프라인 — 사람이 아무것도 실행하지 않는다.
#
#   Release "state" 내려받기 -> GTA 갱신(auto_update.py) -> (월 1회) 기준자료 수집
#   -> 한미 AI 협력: 결정 CSV 반영 + 일일 판단 요청(A 새 사건·B 갱신·C 재검토 → 사이트 review.html) -> Release "state" 올리기 -> 빌드 -> 배포
#
# 일정(UTC 21:00 = 한국 06:00)
#   매일: incremental.  일요일: full(전량 재대조).  매월 4일: 기준자료(BSV·IMF DOTS·WDI)도 수집.
# 비밀값(Settings > Secrets and variables > Actions)
#   GTA_API_KEY(필수), ANTHROPIC_API_KEY(한미 AI 협력 코딩)
# 멈춤 조건은 auto_update.py 의 guard() 가 판정한다. 걸리면 Release 를 건드리지 않고 실패한다.
# 코드만 바뀐 push 는 자료 갱신 없이 빌드·배포만 한다. 문서/ 는 코드북 2종만 빌드를 일으킨다(사이트가 읽는다).
name: pipeline

on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths: ["**", "!문서/**", "문서/코드북*.md", "!README.md", "!CLAUDE.md"]
  workflow_dispatch:
    inputs:
      mode:
        description: "GTA 갱신 모드 (skip = 자료 갱신 없이 빌드·배포만)"
        type: choice
        options: [incremental, full, skip]
        default: incremental
      reference:
        description: "기준자료(BSV·IMF DOTS·WDI) 수집 실행"
        type: boolean
        default: false
      ai_coop:
        description: "한미 AI 협력: 표본 재코딩 검증 (Claude API 비용 발생)"
        type: choice
        options: [none, daily, recode-medium, recode-high]
        default: none
      mail:
        description: "끝나면 결과 메일 보내기 (MAIL_USER·MAIL_PASS 필요)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  MODEL_REVISION: 2cc47b0c3a1224bd949b6154bb0fd966a864d4df   # auto_update.py 와 같아야 한다
  PYTHONUTF8: "1"
  MAIL_ON: ${{ secrets.MAIL_USER != '' && secrets.MAIL_PASS != '' }}   # Gmail 주소 + 앱 비밀번호가 있을 때만 메일
  SITE_URL: https://lskyonsei-jpg.github.io/skl-economic-security-tracker

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 실행 계획
        id: plan
        run: |
          DOW=$(date -u +%u)   # 1=월 ... 7=일
          DOM=$(date -u +%d)
          case "${{ github.event_name }}" in
            schedule)
              if [ "$DOW" = "7" ]; then MODE=full; else MODE=incremental; fi
              if [ "$DOM" = "04" ]; then REFERENCE=true; else REFERENCE=false; fi ;;
            workflow_dispatch)
              MODE="${{ github.event.inputs.mode }}"; REFERENCE="${{ github.event.inputs.reference }}" ;;
            *)
              MODE=skip; REFERENCE=false ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "GTA 모드: $MODE / 기준자료: $REFERENCE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: |
          if [ "${{ steps.plan.outputs.mode }}" != "skip" ]; then
            pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -r requirements.txt
          else
            pip install -r requirements-site.txt requests==2.32.4
          fi
          pip install -r requirements-ai.txt

      - name: HF 모델 캐시
        if: steps.plan.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODEL_REVISION }}

      - name: Release "state" 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache logs data _state
          gh release download state -R "$GITHUB_REPOSITORY" -D _state
          for f in master.parquet prediction_cache.json state.json; do [ -f "_state/$f" ] && mv "_state/$f" cache/; done
          [ -f _state/logs.tar.gz ] && tar -xzf _state/logs.tar.gz -C logs
          if [ -f _state/reference.tar.gz ]; then mkdir -p data/reference && tar -xzf _state/reference.tar.gz -C data/reference; fi
          for f in ai_coop_events.json ai_coop_state.json; do [ -f "_state/$f" ] && cp "_state/$f" "data/$f"; done
          ls -la cache data; echo "리포트 $(ls logs | wc -l)개"

      - name: GTA 갱신
        id: gta
        if: steps.plan.outputs.mode != 'skip'
        env:
          GTA_API_KEY: ${{ secrets.GTA_API_KEY }}
        run: |
          set +e
          python auto_update.py --mode ${{ steps.plan.outputs.mode }} --yes
          RC=$?
          set -e
          if [ "$RC" = "3" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "변경 없음";
          elif [ "$RC" = "0" ]; then echo "changed=true" >> "$GITHUB_OUTPUT";
          else echo "auto_update.py 종료코드 $RC"; exit $RC; fi

      - name: 기준자료 수집 (BSV·IMF DOTS·WDI)
        id: reference
        if: steps.plan.outputs.reference == 'true'
        run: python collect_reference.py && echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 한미 AI 협력 — 결정 반영 + 일일 판단 요청(사이트 review.html)
        id: ai_daily
        if: github.event_name == 'schedule' || github.event.inputs.ai_coop == 'daily'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY 없음 — 건너뜀"; exit 0; fi
          python ai_coop_tasks.py apply
          python ai_coop_tasks.py daily
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 한미 AI 협력 — 표본 재코딩 검증
        id: ai_coop
        if: github.event.inputs.ai_coop == 'recode-high' || github.event.inputs.ai_coop == 'recode-medium'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          EFFORT=$(echo "${{ github.event.inputs.ai_coop }}" | sed 's/recode-//')
          python collect_ai_coop.py recode --effort "$EFFORT"

      - name: 재코딩 결과 아티팩트
        if: steps.ai_coop.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-coop-recode-${{ github.run_id }}
          path: data/ai_coop_recode_*.json
          retention-days: 30

      - name: Release "state" 올리기
        if: steps.gta.outputs.changed == 'true' || steps.reference.outputs.changed == 'true' || steps.ai_daily.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=""
          if [ "${{ steps.gta.outputs.changed }}" = "true" ]; then
            tar -czf logs.tar.gz -C logs .
            UP="$UP cache/master.parquet cache/prediction_cache.json cache/state.json logs.tar.gz"
          fi
          if [ "${{ steps.reference.outputs.changed }}" = "true" ]; then
            tar -czf reference.tar.gz -C data/reference . && UP="$UP reference.tar.gz"
          fi
          if [ "${{ steps.ai_daily.outputs.changed }}" = "true" ]; then
            UP="$UP data/ai_coop_events.json data/ai_coop_state.json"
          fi
          gh release upload state $UP -R "$GITHUB_REPOSITORY" --clobber
          echo "올림: $UP"

      - name: 사이트 빌드
        env:
          GIT_SHA: ${{ github.sha }}
        run: python publish_site.py

      - name: 요약
        run: |
          {
            echo "## pipeline"
            echo
            echo "- GTA 모드: ${{ steps.plan.outputs.mode }} / 변경: ${{ steps.gta.outputs.changed || 'n/a' }}"
            echo "- 기준자료: ${{ steps.reference.outputs.changed || '건너뜀' }} / AI 협력: ${{ github.event.inputs.ai_coop || 'none' }}"
            echo "- state.json: $(tr -d '\n' < cache/state.json | cut -c1-200)"
            echo "- site: $(find site -type f | wc -l)개 파일, $(du -sh site | cut -f1)"
            R=$(ls logs/change_report_*.md 2>/dev/null | tail -1)
            if [ -n "$R" ] && [ "${{ steps.gta.outputs.changed }}" = "true" ]; then
              echo; echo "<details><summary>변경 리포트 앞부분</summary>"; echo; head -80 "$R"; echo; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # ---- 메일 알림: 예약 실행이 끝났을 때, 어떤 실행이든 실패했을 때, 수동 실행에서 mail 을 켰을 때, 커밋 메시지에 [mail] 이 있을 때.
      #      MAIL_USER(Gmail 주소)·MAIL_PASS(앱 비밀번호) 가 없으면 건너뛴다.
      - name: 메일 내용 작성
        id: mail
        if: always() && env.MAIL_ON == 'true' && (github.event_name == 'schedule' || job.status != 'success' || github.event.inputs.mail == 'true' || contains(github.event.head_commit.message, '[mail]'))
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if [ "${{ job.status }}" = "success" ]; then STATUS=성공; else STATUS=실패; fi
          P=$(python -c "import json;d=json.load(open('site/review.json'));print(d['pending'])" 2>/dev/null || echo "?")
          NEW=$(grep -ho '신규 [0-9,]*건' logs/change_report_*.md 2>/dev/null | tail -1)
          echo "subject=[SKL Tracker] $TODAY $STATUS · 판단 대기 ${P}건${NEW:+ · $NEW}" >> "$GITHUB_OUTPUT"
          {
            echo "## SKL Economic Security Tracker — $TODAY 갱신 ($STATUS)"
            echo
            echo "- 판단 대기 **${P}건** → $SITE_URL/review.html"
            echo "- GTA 모드: ${{ steps.plan.outputs.mode }} / 변경: ${{ steps.gta.outputs.changed || 'n/a' }}"
            echo "- 사이트: $SITE_URL"
            echo "- 실행 기록: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          } > mail.md
      - name: 메일 발송
        if: always() && steps.mail.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          from: SKL Tracker <${{ secrets.MAIL_USER }}>
          to: ${{ secrets.MAIL_USER }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: file://mail.md
          convert_markdown: true
