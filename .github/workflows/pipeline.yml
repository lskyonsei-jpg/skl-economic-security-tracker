# 전체 파이프라인 — 사람이 아무것도 실행하지 않는다. 패널 1과 패널 2는 서로 독립된 작업(job)으로 병렬로 돈다(연구자 결정 2026-10-22).
#
#   plan ─┬─ panel1  GTA 갱신(auto_update.py) → (월 1회) 기준자료 수집 → Release "state" 에 GTA 자산 올리기
#         └─ panel2  한미 AI 협력: 결정 반영(apply) → 일일 판단 요청(daily) → Release "state" 에 사건·제안 파일 올리기
#         └─ site    (둘 다 끝난 뒤, 실패해도) Release "state" 내려받기 → 빌드 → 배포 → 정리 → 메일
#
# 한쪽 패널이 실패해도 다른 패널과 사이트 배포는 진행된다. 실패한 패널은 어제 자료 그대로 보인다.
# 일정(UTC 21:00 = 한국 06:00). 매일: incremental.  일요일: full(전량 재대조).  매월 4일: 기준자료(BSV·IMF DOTS·WDI)도 수집.
# 비밀값(Settings > Secrets and variables > Actions)
#   GTA_API_KEY(패널 1 필수), ANTHROPIC_API_KEY(패널 2), MAIL_USER·MAIL_PASS(메일, 선택)
# 멈춤 조건은 auto_update.py 의 guard() 가 판정한다. 걸리면 Release 를 건드리지 않고 그 작업만 실패한다.
# 코드만 바뀐 push 는 자료 갱신 없이 빌드·배포만 한다. 문서/ 는 코드북 2종만 빌드를 일으킨다(사이트가 읽는다).
name: pipeline

on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths: ["**", "!문서/**", "문서/코드북*.md", "!README.md", "!CLAUDE.md", "!.deploy_stamp"]
  workflow_dispatch:
    inputs:
      mode:
        description: "패널 1 GTA 갱신 모드 (skip = 갱신 없음)"
        type: choice
        options: [incremental, full, skip]
        default: incremental
      reference:
        description: "패널 1 기준자료(BSV·IMF DOTS·WDI) 수집"
        type: boolean
        default: false
      ai_coop:
        description: "패널 2 한미 AI 협력: 결정 반영 + 일일 판단 요청 (Claude API 비용 발생)"
        type: choice
        options: [none, daily]
        default: none
      mail:
        description: "끝나면 결과 메일 보내기 (MAIL_USER·MAIL_PASS 필요)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: write   # 정리 단계: 아티팩트·옛 실행 기록 삭제

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  MODEL_REVISION: 2cc47b0c3a1224bd949b6154bb0fd966a864d4df   # auto_update.py 와 같아야 한다
  PYTHONUTF8: "1"
  TZ: Asia/Seoul   # 실행 서버는 UTC. 날짜(제안 ID·created·빌드 시각)가 한국 기준이 되게 고정 (2026-10-23)
  SITE_URL: https://lskyonsei-jpg.github.io/skl-economic-security-tracker

jobs:
  # ------------------------------------------------------------------ 실행 계획
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reference: ${{ steps.plan.outputs.reference }}
      ai_coop: ${{ steps.plan.outputs.ai_coop }}
    steps:
      - id: plan
        run: |
          DOW=$(date -u +%u)   # 1=월 ... 7=일
          DOM=$(date -u +%d)
          case "${{ github.event_name }}" in
            schedule)
              if [ "$DOW" = "7" ]; then MODE=full; else MODE=incremental; fi
              if [ "$DOM" = "04" ]; then REFERENCE=true; else REFERENCE=false; fi
              AI=true ;;
            workflow_dispatch)
              MODE="${{ github.event.inputs.mode }}"; REFERENCE="${{ github.event.inputs.reference }}"
              if [ "${{ github.event.inputs.ai_coop }}" = "daily" ]; then AI=true; else AI=false; fi ;;
            *)
              MODE=skip; REFERENCE=false; AI=false ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "ai_coop=$AI" >> "$GITHUB_OUTPUT"
          echo "패널 1 GTA 모드: $MODE / 기준자료: $REFERENCE / 패널 2 일일 실행: $AI"

  # ------------------------------------------------------------------ 패널 1: Distortive Industrial Policy Tracker
  panel1:
    needs: plan
    if: needs.plan.outputs.mode != 'skip' || needs.plan.outputs.reference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 의존성 설치
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: HF 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODEL_REVISION }}
      - name: 보관함에서 GTA 자료 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache logs data _state
          gh release download state -R "$GITHUB_REPOSITORY" -D _state -p master.parquet -p prediction_cache.json -p state.json -p logs.tar.gz -p reference.tar.gz
          for f in master.parquet prediction_cache.json state.json; do [ -f "_state/$f" ] && mv "_state/$f" cache/; done
          [ -f _state/logs.tar.gz ] && tar -xzf _state/logs.tar.gz -C logs
          if [ -f _state/reference.tar.gz ]; then mkdir -p data/reference && tar -xzf _state/reference.tar.gz -C data/reference; fi
          ls -la cache; echo "리포트 $(ls logs | wc -l)개"
      - name: GTA 갱신
        id: gta
        if: needs.plan.outputs.mode != 'skip'
        env:
          GTA_API_KEY: ${{ secrets.GTA_API_KEY }}
        run: |
          set +e
          python auto_update.py --mode ${{ needs.plan.outputs.mode }} --yes
          RC=$?
          set -e
          if [ "$RC" = "3" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "변경 없음";
          elif [ "$RC" = "0" ]; then echo "changed=true" >> "$GITHUB_OUTPUT";
          else echo "auto_update.py 종료코드 $RC"; exit $RC; fi
      - name: 기준자료 수집 (BSV·IMF DOTS·WDI)
        id: reference
        if: needs.plan.outputs.reference == 'true'
        run: python collect_reference.py && echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: 보관함에 GTA 자료 올리기
        if: steps.gta.outputs.changed == 'true' || steps.reference.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=""
          if [ "${{ steps.gta.outputs.changed }}" = "true" ]; then
            tar -czf logs.tar.gz -C logs .
            UP="$UP cache/master.parquet cache/prediction_cache.json cache/state.json logs.tar.gz"
          fi
          if [ "${{ steps.reference.outputs.changed }}" = "true" ]; then
            tar -czf reference.tar.gz -C data/reference . && UP="$UP reference.tar.gz"
          fi
          gh release upload state $UP -R "$GITHUB_REPOSITORY" --clobber
          echo "올림: $UP"
      - name: 요약
        run: |
          {
            echo "## 패널 1"
            echo "- GTA 모드: ${{ needs.plan.outputs.mode }} / 변경: ${{ steps.gta.outputs.changed || 'n/a' }} / 기준자료: ${{ steps.reference.outputs.changed || '건너뜀' }}"
            echo "- state.json: $(tr -d '\n' < cache/state.json | cut -c1-200)"
            R=$(ls logs/change_report_*.md 2>/dev/null | tail -1)
            if [ -n "$R" ] && [ "${{ steps.gta.outputs.changed }}" = "true" ]; then
              echo; echo "<details><summary>변경 리포트 앞부분</summary>"; echo; head -80 "$R"; echo; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ 패널 2: 한미 AI 협력 트래커
  panel2:
    needs: plan
    if: needs.plan.outputs.ai_coop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - name: 의존성 설치
        run: pip install -r requirements-ai.txt requests==2.32.4
      - name: 보관함에서 사건·제안 파일 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data _state
          gh release download state -R "$GITHUB_REPOSITORY" -D _state -p ai_coop_events.json -p ai_coop_state.json
          for f in ai_coop_events.json ai_coop_state.json; do [ -f "_state/$f" ] && cp "_state/$f" "data/$f"; done
          ls -la data
      - name: 결정 반영 + 일일 판단 요청
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY 없음 — 건너뜀"; exit 0; fi
          python ai_coop_tasks.py apply
          python ai_coop_tasks.py daily
      - name: 보관함에 사건·제안 파일 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload state data/ai_coop_events.json data/ai_coop_state.json -R "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ 사이트: 빌드·배포·정리·메일 (두 패널이 끝난 뒤, 실패해도)
  site:
    needs: [plan, panel1, panel2]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MAIL_ON: ${{ secrets.MAIL_USER != '' && secrets.MAIL_PASS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: 의존성 설치
        run: pip install -r requirements-site.txt
      - name: 보관함에서 전부 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache logs data _state
          gh release download state -R "$GITHUB_REPOSITORY" -D _state
          for f in master.parquet prediction_cache.json state.json; do [ -f "_state/$f" ] && mv "_state/$f" cache/; done
          [ -f _state/logs.tar.gz ] && tar -xzf _state/logs.tar.gz -C logs
          if [ -f _state/reference.tar.gz ]; then mkdir -p data/reference && tar -xzf _state/reference.tar.gz -C data/reference; fi
          for f in ai_coop_events.json ai_coop_state.json; do [ -f "_state/$f" ] && cp "_state/$f" "data/$f"; done
          ls -la cache data; echo "리포트 $(ls logs | wc -l)개"
      - name: 사이트 빌드
        env:
          GIT_SHA: ${{ github.sha }}
        run: python publish_site.py
      - name: 요약
        run: |
          {
            echo "## 사이트"
            echo "- 패널 1: ${{ needs.panel1.result }} / 패널 2: ${{ needs.panel2.result }}"
            echo "- site: $(find site -type f | wc -l)개 파일, $(du -sh site | cut -f1) / 판단 대기: $(python -c "import json;print(json.load(open('site/review.json'))['pending'])" 2>/dev/null || echo '?')건"
          } >> "$GITHUB_STEP_SUMMARY"
      # GitHub Pages 는 커밋 SHA 를 배포 버전으로 쓴다. 같은 SHA 로 다시 배포하면 "성공"이라고 하면서 옛 내용을 그대로 둔다
      # (2026-10-23 예약 실행에서 실측). 그래서 마지막 배포와 같은 커밋이면 스탬프 커밋을 하나 만들고 그 커밋으로 배포 실행을 새로 띄운다.
      - name: 배포 방식 결정
        id: how
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].sha // ""')
          if [ "$LAST" = "$GITHUB_SHA" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; echo "마지막 배포와 같은 커밋 — 스탬프 커밋으로 재배포";
          else echo "same=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.how.outputs.same != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.how.outputs.same != 'true'
        with:
          path: site
      - id: deploy
        if: steps.how.outputs.same != 'true'
        uses: actions/deploy-pages@v4
      - name: 같은 커밋 재배포 — 스탬프 커밋 후 새 실행으로 배포
        if: steps.how.outputs.same == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date +"%Y-%m-%d %H:%M %Z" > .deploy_stamp
          git add .deploy_stamp
          git commit -q -m "[deploy] $(cat .deploy_stamp) 자료 갱신 배포용 스탬프"
          git push -q origin HEAD:main
          gh workflow run pipeline.yml --ref main -f mode=skip -f reference=false -f ai_coop=none -f mail=false
          echo "새 커밋 $(git rev-parse --short HEAD) 으로 배포 실행을 띄웠다"

      # ---- 정리: 이 실행의 아티팩트만 남기고 지우고, 30일 지난 실행 기록을 지운다. 개별 실패는 경고만.
      - name: 아티팩트·옛 실행 기록 정리
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let a = 0, r = 0;
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
            for (const x of arts) {
              if (x.expired || x.workflow_run?.id === context.runId) continue;
              try { await github.rest.actions.deleteArtifact({owner, repo, artifact_id: x.id}); a++; }
              catch (e) { core.warning(`아티팩트 ${x.id} 삭제 실패: ${e.message}`); }
            }
            const cutoff = Date.now() - 30 * 86400e3;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, per_page: 100});
            for (const x of runs) {
              if (x.id === context.runId || x.status !== 'completed' || new Date(x.created_at).getTime() >= cutoff) continue;
              try { await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: x.id}); r++; }
              catch (e) { core.warning(`실행 기록 ${x.id} 삭제 실패: ${e.message}`); }
            }
            core.info(`아티팩트 ${a}개, 실행 기록 ${r}개 삭제`);

      # ---- 메일 알림: 예약 실행이 끝났을 때, 어느 작업이든 실패했을 때, 수동 실행에서 mail 을 켰을 때, 커밋 메시지에 [mail] 이 있을 때.
      #      MAIL_USER(Gmail 주소)·MAIL_PASS(앱 비밀번호) 가 없으면 건너뛴다.
      - name: 메일 내용 작성
        id: mail
        if: always() && env.MAIL_ON == 'true' && (github.event_name == 'schedule' || job.status != 'success' || needs.panel1.result == 'failure' || needs.panel2.result == 'failure' || github.event.inputs.mail == 'true' || contains(github.event.head_commit.message, '[mail]'))
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          P1="${{ needs.panel1.result }}"; P2="${{ needs.panel2.result }}"
          if [ "${{ job.status }}" = "success" ] && [ "$P1" != "failure" ] && [ "$P2" != "failure" ]; then STATUS=성공; else STATUS=실패; fi
          K() { case "$1" in success) echo 성공;; failure) echo 실패;; skipped) echo 건너뜀;; *) echo "$1";; esac; }
          P=$(python -c "import json;d=json.load(open('site/review.json'));print(d['pending'])" 2>/dev/null || echo "?")
          NEW=$(grep -ho '신규 [0-9,]*건' logs/change_report_*.md 2>/dev/null | tail -1)
          echo "subject=[SKL Tracker] $TODAY $STATUS · 판단 대기 ${P}건${NEW:+ · $NEW}" >> "$GITHUB_OUTPUT"
          {
            echo "## SKL Economic Security Tracker — $TODAY 갱신 ($STATUS)"
            echo
            echo "- 패널 1 산업정책: $(K "$P1") (GTA 모드 ${{ needs.plan.outputs.mode }})"
            echo "- 패널 2 한미 AI 협력: $(K "$P2") · 판단 대기 **${P}건** → $SITE_URL/review.html"
            echo "- 사이트: $SITE_URL"
            echo "- 실행 기록: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          } > mail.md
      - name: 메일 발송
        if: always() && steps.mail.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          from: SKL Tracker <${{ secrets.MAIL_USER }}>
          to: ${{ secrets.MAIL_USER }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: file://mail.md
          convert_markdown: true
