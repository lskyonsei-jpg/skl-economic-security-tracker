<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D,G,TH={},XMIN=-2,XMAX=3,MAXSIZE=.2;
const RMIN=3,RMAX=26;
function rOf(v){return v==null?6:RMIN+Math.sqrt(Math.min(v,MAXSIZE)/MAXSIZE)*(RMAX-RMIN)}
function fmtSize(v,metric){if(v==null)return'자료없음';metric=metric||state.sizevar;return metric==='gdp_usd'?`$${(v/1e9).toLocaleString(undefined,{maximumFractionDigits:0})}B`:`${(v*100).toFixed(2)}%`}
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const state={imp:'United States of America',year:2024,yearFrom:2010,yearTo:2026,topN:200,xvar:'bsv_ideal_point',sizevar:'trade_share',compMode:'cumulative',targetedOnly:false,hs2:new Set()};
let SEC=null;
function computeScatterDomain(xk,sk){xk=xk||state.xvar;sk=sk||state.sizevar;if(xk!=='fed_bloc'){const ip=D.rows.filter(r=>r[xk]!=null).map(r=>r[xk]);XMIN=Math.min(...ip);XMAX=Math.max(...ip)}const sv=D.rows.filter(r=>r[sk]!=null).map(r=>r[sk]);MAXSIZE=sv.length?Math.max(...sv):.2}
function linreg(pts){const n=pts.length;if(n<2)return null;const mx=pts.reduce((s,p)=>s+p.x,0)/n,my=pts.reduce((s,p)=>s+p.y,0)/n;let sxy=0,sxx=0,syy=0;for(const p of pts){sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2}if(sxx===0)return null;const b=sxy/sxx,a=my-b*mx,r=syy?sxy/Math.sqrt(sxx*syy):0;return{a,b,r}}
// 산점도·회귀는 **건수만** 쓴다(2026-08-24). 예전에는 분모(시행국 연도별 총 조치
// 건수)로 나눈 노출 비중을 함께 계산했는데, 세로축을 건수로 바꾼 뒤에도 분수가
// 툴팁과 반환값에 남아 '무엇을 회귀한 것인가'를 흐렸다. 분모 자체가 시행국의
// 공고 습관(부처별 반복 공고 습관, 지방정부 공고 수)에 좌우돼 지정학적 신호가
// 아닌 잡음을 x축과 무관하게 y축에 실어 나른다. 분수는 전부 뺀다.
// 지도·순위·추이의 risk_index는 정의상 비중 × 거리이므로 그대로 둔다.
// 산점도는 ip_sectors.json(조치 단위 원자료)에서 매번 다시 집계한다(2026-08-24).
// 기본으로 중복 제거(#DUP_RULE_20260824)만 걸고(부처별 하드코딩 예외는 없앴다),
// 화면에서 시행 수준(지방정부 제외)과 산업(HS4)을 추가로 걸 수 있다.
const IMP_CODE={'United States of America':0,'China':1};
function exposedCounts(imp,yFrom,yTo){const code=IMP_CODE[imp],sel=state.hs2,hasSel=sel.size>0;const out={};for(const m of SEC.measures){if(m.m!==code||m.y<yFrom||m.y>yTo||m.x)continue;if(state.targetedOnly&&!m.t)continue;if(hasSel&&!m.h.some(h=>sel.has(h)))continue;for(const iso of m.a)out[iso]=(out[iso]||0)+1}return out}
function poolRows(imp,yFrom,yTo,key){const cat=(key==='fed_bloc');const by={};for(const r of D.rows){if(r.implementer!==imp||r.year<yFrom||r.year>yTo)continue;if(r[key]==null)continue;const c=by[r.affected_iso3]||(by[r.affected_iso3]={distSum:0,distN:0,cat:null,country:r.affected_country,tradeSum:0,tradeN:0,gdpSum:0,gdpN:0});if(cat){c.cat=r[key]}else{c.distSum+=r[key];c.distN++}if(r.trade_share!=null){c.tradeSum+=r.trade_share;c.tradeN++}if(r.gdp_usd!=null){c.gdpSum+=r.gdp_usd;c.gdpN++}}const counts=exposedCounts(imp,yFrom,yTo);const out=[];for(const iso3 in counts){const exp=counts[iso3];const c=by[iso3];if(!exp||!c||(cat?c.cat==null:!c.distN))continue;out.push({affected_country:c.country,affected_iso3:iso3,exposed_count:exp,[key]:cat?c.cat:c.distSum/c.distN,trade_share:c.tradeN?c.tradeSum/c.tradeN:null,gdp_usd:c.gdpN?c.gdpSum/c.gdpN:null})}return out}
function fitOf(rows,key,yfield){yfield=yfield||'exposed_count';return rows.length>=5?linreg(rows.map(r=>({x:r[key],y:r[yfield]}))):null}
function corr(xs,ys){const n=xs.length;if(n<3)return null;const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2;syy+=(ys[i]-my)**2}return(sxx&&syy)?sxy/Math.sqrt(sxx*syy):null}
// 무역비중 통제(2026-08-24) — 두 나라가 원래 교역이 크면 GTA affected-jurisdiction
// 등재 기회 자체가 늘어난다(교역 없이는 애초에 AJ 명단에 못 오른다, 100만불 규칙).
// 그 규모 효과를 떼어내고도 지정학적 위치가 남는 상관인지 보려고 편상관(partial
// correlation)을 쓴다. 무역비중은 5자릿수 이상 벌어지는 멱법칙 분포라(최소
// 6e-7~최대 0.15) ln(무역비중)으로 통제한다 — 원 척도로 통제하면 상위 몇 개국이
// 통제변수 분산을 다 먹어 나머지 표본에서 통제가 사실상 무력화된다.
//   r_xy·z = (r_xy − r_xz·r_zy) / sqrt((1−r_xz²)(1−r_zy²)),  df = n−3
function partialFit(rows,key,yfield){yfield=yfield||'exposed_count';const sub=rows.filter(r=>r.trade_share!=null&&r.trade_share>0);if(sub.length<6)return null;const xs=sub.map(r=>r[key]),ys=sub.map(r=>r[yfield]),zs=sub.map(r=>Math.log(r.trade_share));const rxy=corr(xs,ys),rxz=corr(xs,zs),rzy=corr(zs,ys);if(rxy==null||rxz==null||rzy==null)return null;const den=Math.sqrt((1-rxz*rxz)*(1-rzy*rzy));if(!den)return null;return{n:sub.length,r:(rxy-rxz*rzy)/den}}
// 단순 이변량 회귀의 기울기 t검정. 상관계수 t검정과 대수적으로 동일하다:
//   t = b/SE(b) = r*sqrt(n-2)/sqrt(1-r^2),  df = n-2
// 이전에 쓰던 Fisher z는 r의 신뢰구간·두 r 비교용 도구이고 여기선 근사일 뿐이다.
// JS에 t분포 CDF가 없어 정규근사가 편해서 썼던 것인데, n을 10 아래로 줄이는
// TOP N 화면에서 p를 최대 2배 낙관적으로 만든다(China N=10: 0.0026 vs 0.0014).
// 정규화 불완전 베타함수를 직접 구현해 정확한 t검정으로 바꾼다.
function lgamma(z){const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);
z-=1;let x=0.99999999999980993;for(let i=0;i<8;i++)x+=g[i]/(z+i+1);
const t=z+7.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x)}
function betacf(a,b,x){const TINY=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;
if(Math.abs(d)<TINY)d=TINY;d=1/d;let h=d;
for(let m=1;m<=300;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));
d=1+aa*d;if(Math.abs(d)<TINY)d=TINY;c=1+aa/c;if(Math.abs(c)<TINY)c=TINY;d=1/d;h*=d*c;
aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<TINY)d=TINY;
c=1+aa/c;if(Math.abs(c)<TINY)c=TINY;d=1/d;const de=d*c;h*=de;
if(Math.abs(de-1)<3e-14)break}return h}
function betai(a,b,x){if(x<=0)return 0;if(x>=1)return 1;
const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
function tStat(r,n,df){return (r==null||df<=0||Math.abs(r)>=1)?null:r*Math.sqrt(df)/Math.sqrt(1-r*r)}
function pValue(r,n,df){df=df??(n-2);const t=tStat(r,n,df);if(t==null)return null;
return betai(df/2,0.5,df/(df+t*t))}
function pText(p){if(p==null)return'n/a';if(p<1e-4)return'&lt;0.0001';return p.toFixed(4)}
function stars(p){if(p==null)return{s:'n/a',cls:'signone'};if(p<.001)return{s:'***',cls:'sig3'};if(p<.01)return{s:'**',cls:'sig2'};if(p<.05)return{s:'*',cls:'sig1'};return{s:'',cls:'signone'}}
function pickCountStep(mx){for(const st of [1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000]){if(Math.ceil(mx/st)<=5)return st}return 20000}
function scatterPanel(svgId,key){const svg=$('#'+svgId),gap=34,subW=(1000-36-gap*2-12)/2,oy=74,plotH=330,plotB=oy+plotH;let out='';const stats=[];
[['United States of America','미국',0,tok('--mint-deep'),'#ffffff',tok('--mint-deep')],['China','중국',1,tok('--coral'),tok('--ink'),tok('--coral-deep')]].forEach(([imp,label,idx,color,labelColor,lineColor])=>{
 const ox=36+gap+idx*(subW+gap),pl=ox+86,pr=ox+subW-10,plotW=pr-pl;
 const pooled=poolRows(imp,state.yearFrom,state.yearTo,key);
 const ranked=pooled.slice().sort((a,b)=>(b.trade_share??-1)-(a.trade_share??-1));
 const rows=ranked.slice(0,state.topN);
 const fit=fitOf(rows,key);
 const cutT=rows.length&&rows.length<ranked.length?rows[rows.length-1].trade_share:null;
 stats.push({label,n:rows.length,fit,cutTrade:cutT,partial:partialFit(rows,key)});
 // 건수는 시행국별 총 조치 수가 달라(미국 ~5천 vs 중국 ~1.7천) 축을 공유하면
 // 한쪽이 뭉갠다. 패널마다 자기 최댓값으로 눈금을 잡고, 대신 제목에 총 조치 수를 적는다.
 const mx=rows.reduce((a,r)=>Math.max(a,r.exposed_count),0)||1;
 const step=pickCountStep(mx),nT=Math.max(1,Math.ceil(mx/step)),yMax=step*nT;
 const x=v=>pl+(v-XMIN)/(XMAX-XMIN)*plotW,y=v=>plotB-v/yMax*plotH;
 let grid='';
 for(let k=0;k<=nT;k++){const yv=step*k,py=y(yv);grid+=`<line class="grid" x1="${pl}" x2="${pr}" y1="${py}" y2="${py}"/><text x="${pl-10}" y="${py+8}" text-anchor="end">${yv.toLocaleString()}</text>`}
 for(let k=0;k<=4;k++){const xv=XMIN+(XMAX-XMIN)*k/4,px=x(xv);grid+=`<text x="${px}" y="${plotB+30}" text-anchor="middle">${xv.toFixed(1)}</text>`}grid+=`<line class="grid" x1="${x(0)}" x2="${x(0)}" y1="${oy}" y2="${plotB}" stroke-dasharray="3,3"/>`;
 out+=`<text class="title" x="${ox+subW/2}" y="26" text-anchor="middle">${label} 시행 · ${state.yearFrom}~${state.yearTo}</text>`;
 out+=`<text class="sub" x="${ox+subW/2}" y="56" text-anchor="middle">n=${rows.length}${fit?` · r=${fit.r.toFixed(2)}`:' · n&lt;5'}</text>`;
 out+=grid;
 out+=`<line class="axis" x1="${pl}" x2="${pr}" y1="${plotB}" y2="${plotB}"/><line class="axis" x1="${pl}" x2="${pl}" y1="${oy}" y2="${plotB}"/>`;
 if(fit){const xs=rows.map(r=>r[key]),x0=Math.min(...xs),x1v=Math.max(...xs),y0=Math.max(0,Math.min(yMax,fit.a+fit.b*x0)),y1v=Math.max(0,Math.min(yMax,fit.a+fit.b*x1v));
  out+=`<line x1="${x(x0).toFixed(1)}" y1="${y(y0).toFixed(1)}" x2="${x(x1v).toFixed(1)}" y2="${y(y1v).toFixed(1)}" stroke="${lineColor}" stroke-width="3.5" stroke-dasharray="10,6" opacity=".95"/>`}
 const items=rows.map(r=>({r,rad:rOf(r[state.sizevar]),cx:x(r[key]),cy:y(r.exposed_count)}));
 const byRad=items.slice().sort((a,b)=>b.rad-a.rad);
 out+=byRad.map(it=>`<circle class="dot" cx="${it.cx.toFixed(1)}" cy="${it.cy.toFixed(1)}" r="${it.rad.toFixed(1)}" fill="${color}" fill-opacity=".9" stroke="#fff" stroke-width="1.4" data-tip="${esc(it.r.affected_country)}|${it.r[key].toFixed(3)}|${it.r.exposed_count.toLocaleString()}|${esc(fmtSize(it.r[state.sizevar]))}"></circle>`).join('');
 // 원 크기(선택 지표) 기준 상위 10개에만 ISO3 라벨 — 지표를 바꿔도 "가장 큰 원에 라벨"이 유지된다.
 // 라벨 크기를 원 반지름(무역비중)에 비례시킨다 — 전에는 고정 9px이라 작은
 // 원 위로 글자가 삐져나와 서로 겹쳤다. 최소 6px은 유지해야 읽히고, 큰 원도
 // 원 지름을 넘지 않게 14px에서 자른다.
 out+=byRad.slice(0,10).map(it=>{const fs=19;return `<text class="iso" x="${it.cx.toFixed(1)}" y="${(it.cy+fs*.36).toFixed(1)}" text-anchor="middle" style="font-size:${fs}px;fill:${lineColor}" pointer-events="none">${esc(it.r.affected_iso3)}</text>`}).join('');
 out+=`<text class="sub" x="${ox+subW/2}" y="${plotB+66}" text-anchor="middle">BSV ideal point (친중 ← → 친미)</text>`});
out+=`<text class="sub" transform="rotate(-90)" x="-${oy+plotH/2}" y="26" text-anchor="middle">피영향 건수</text>`;svg.innerHTML=out;bindScatterTip(svg);return stats}
// ---- Fed(2025) 블록 3분류 화면 ---------------------------------------
// FEDS Notes는 seg를 연속 지표로 쓰지 않는다 — 미국 근접 상위 25%(US), 중국
// 근접 상위 25%(CN), 나머지(NA)로 잘라 **더미**를 만들고 그 더미를 중력방정식에
// 넣는다. 사분위 경계는 단조변환에 불변이라, seg 분포가 −1 쪽으로 쏠려 있다는
// 사실이 블록 분류에는 아무 영향도 주지 않는다. 그래서 이 화면에는 회귀선도
// r도 없다 — x가 순서형 3범주이므로 상관계수를 계산하는 것 자체가 정의 위반이다.
// 연속 회귀는 BSV ideal point 축에서만 한다.
const BLOCS=[['CN','중국 블록'],['NA','비동맹'],['US','미국 블록']];
function pFromT(t,df){return (t==null||!isFinite(t)||df<=0)?null:betai(df/2,0.5,df/(df+t*t))}
function summ(vs){const n=vs.length;if(!n)return null;const m=vs.reduce((a,b)=>a+b,0)/n;
 const sd=n>1?Math.sqrt(vs.reduce((a,b)=>a+(b-m)**2,0)/(n-1)):0;
 const so=vs.slice().sort((a,b)=>a-b),md=n%2?so[(n-1)/2]:(so[n/2-1]+so[n/2])/2;
 return{n,mean:m,sd,median:md,sum:vs.reduce((a,b)=>a+b,0)}}
// Welch t — 블록 더미 회귀의 2표본 판이다. 건수 분포가 오른쪽으로 길어
// 등분산을 가정할 근거가 없으므로 Welch를 쓴다.
function welch(a,b){if(!a||!b||a.n<2||b.n<2)return null;
 const va=a.sd**2/a.n,vb=b.sd**2/b.n,den=va+vb;if(!den)return null;
 const t=(a.mean-b.mean)/Math.sqrt(den),df=den*den/((va*va)/(a.n-1)+(vb*vb)/(b.n-1));
 return{t,df,p:pFromT(t,df),diff:a.mean-b.mean}}
function blocPanel(svgId){const svg=$('#'+svgId),gap=34,subW=(1000-36-gap*2-12)/2,oy=74,plotH=330,plotB=oy+plotH;let out='';const stats=[];
 [['United States of America','미국',0,tok('--mint-deep'),'#ffffff',tok('--mint-deep')],['China','중국',1,tok('--coral'),tok('--ink'),tok('--coral-deep')]].forEach(([imp,label,idx,color,labelColor,lineColor])=>{
  const ox=36+gap+idx*(subW+gap),pl=ox+86,pr=ox+subW-10,plotW=pr-pl;
  const pooled=poolRows(imp,state.yearFrom,state.yearTo,'fed_bloc');
  const ranked=pooled.slice().sort((a,b)=>(b.trade_share??-1)-(a.trade_share??-1));
  const rows=ranked.slice(0,state.topN);
  const cutT=rows.length&&rows.length<ranked.length?rows[rows.length-1].trade_share:null;
  const groups={};BLOCS.forEach(([k])=>{groups[k]=summ(rows.filter(r=>r.fed_bloc===k).map(r=>r.exposed_count))});
  stats.push({label,n:rows.length,groups,cutTrade:cutT,test:welch(groups.US,groups.CN)});
  const mx=rows.reduce((a,r)=>Math.max(a,r.exposed_count),0)||1;
  const step=pickCountStep(mx),nT=Math.max(1,Math.ceil(mx/step)),yMax=step*nT;
  const y=v=>plotB-v/yMax*plotH,bandW=plotW/3,cx0=k=>pl+bandW*(k+.5);
  let grid='';
  for(let k=0;k<=nT;k++){const yv=step*k,py=y(yv);grid+=`<line class="grid" x1="${pl}" x2="${pr}" y1="${py}" y2="${py}"/><text x="${pl-10}" y="${py+8}" text-anchor="end">${yv.toLocaleString()}</text>`}
  for(let k=1;k<3;k++){const px=pl+bandW*k;grid+=`<line class="grid" x1="${px}" x2="${px}" y1="${oy}" y2="${plotB}" stroke-dasharray="3,3"/>`}
  BLOCS.forEach(([k,nm],i)=>{const g=groups[k];grid+=`<text x="${cx0(i)}" y="${plotB+30}" text-anchor="middle">${nm}</text><text class="sub" x="${cx0(i)}" y="${plotB+58}" text-anchor="middle" style="fill:var(--muted)">n=${g?g.n:0}</text>`});
  out+=`<text class="title" x="${ox+subW/2}" y="26" text-anchor="middle">${label} 시행 · ${state.yearFrom}~${state.yearTo}</text>`;
  out+=`<text class="sub" x="${ox+subW/2}" y="56" text-anchor="middle">n=${rows.length} · 실선 = 블록 평균</text>`;
  out+=grid;
  out+=`<line class="axis" x1="${pl}" x2="${pr}" y1="${plotB}" y2="${plotB}"/><line class="axis" x1="${pl}" x2="${pl}" y1="${oy}" y2="${plotB}"/>`;
  // 같은 밴드 안에서 점이 완전히 겹치지 않게 결정적 지터를 준다(난수 아님 —
  // 다시 그릴 때마다 점이 춤추면 화면을 신뢰할 수 없다). ISO3 문자코드 해시.
  const jit=iso=>{let h=0;for(let i=0;i<iso.length;i++)h=(h*31+iso.charCodeAt(i))%1000;return (h/1000-.5)*bandW*.72};
  const items=rows.map(r=>{const i=BLOCS.findIndex(([k])=>k===r.fed_bloc);return{r,rad:rOf(r[state.sizevar]),cx:cx0(i<0?1:i)+jit(r.affected_iso3),cy:y(r.exposed_count)}});
  const byRad=items.slice().sort((a,b)=>b.rad-a.rad);
  out+=byRad.map(it=>`<circle class="dot" cx="${it.cx.toFixed(1)}" cy="${it.cy.toFixed(1)}" r="${it.rad.toFixed(1)}" fill="${color}" fill-opacity=".85" stroke="#fff" stroke-width="1.4" data-tip="${esc(it.r.affected_country)}|${esc(BLOCS.find(([k])=>k===it.r.fed_bloc)?.[1]??'분류없음')}|${it.r.exposed_count.toLocaleString()}|${esc(fmtSize(it.r[state.sizevar]))}"/>`).join('');
  BLOCS.forEach(([k],i)=>{const g=groups[k];if(!g)return;const py=y(Math.min(g.mean,yMax));
   out+=`<line x1="${(cx0(i)-bandW*.42).toFixed(1)}" x2="${(cx0(i)+bandW*.42).toFixed(1)}" y1="${py.toFixed(1)}" y2="${py.toFixed(1)}" stroke="${lineColor}" stroke-width="3.5" opacity=".95"/>`});
  out+=byRad.slice(0,10).map(it=>{const fs=19;return `<text class="iso" x="${it.cx.toFixed(1)}" y="${(it.cy+fs*.36).toFixed(1)}" text-anchor="middle" style="font-size:${fs}px;fill:${lineColor}" pointer-events="none">${esc(it.r.affected_iso3)}</text>`}).join('');
  out+=`<text class="sub" x="${ox+subW/2}" y="${plotB+88}" text-anchor="middle">Fed 블록 (친중 ← → 친미)</text>`});
 out+=`<text class="sub" transform="rotate(-90)" x="-${oy+plotH/2}" y="26" text-anchor="middle">피영향 건수</text>`;svg.innerHTML=out;bindScatterTip(svg);return stats}
function renderBlocTable(list){let html='<thead><tr><th>시행국</th><th>블록</th><th>n</th><th>평균 건수</th><th>중앙값</th><th>합계(점유율)</th></tr></thead><tbody>';
 for(const s of list){const tot=BLOCS.reduce((a,[k])=>a+(s.groups[k]?s.groups[k].sum:0),0);
  BLOCS.forEach(([k,nm],i)=>{const g=s.groups[k];
   html+=`<tr><td>${i===0?esc(s.label):''}</td><td>${nm}</td><td>${g?g.n:0}</td><td>${g?g.mean.toFixed(1):'n/a'}</td><td>${g?g.median.toFixed(0):'n/a'}</td><td>${g&&tot?`${g.sum.toLocaleString()} (${(g.sum/tot*100).toFixed(1)}%)`:'n/a'}</td></tr>`});
  const t=s.test,st=t?stars(t.p):null;
  html+=`<tr><td></td><td colspan="5" class="reg-note" style="text-align:left">미국블록 − 중국블록 평균차 ${t?`<b>${t.diff>0?'+':''}${t.diff.toFixed(1)}건</b> · Welch t=${t.t.toFixed(2)}, df=${t.df.toFixed(0)}, p ${pText(t.p)} <span class="${st.cls}">${st.s}</span>`:'n/a'}</td></tr>`}
 html+='</tbody>';$('#regtable').innerHTML=html}
// 원에 마우스를 올리면 국가명과 값을 띄운다. SVG <title>은 표시가 1초쯤 늦어
// 지도·추이 패널과 같은 HTML 툴팁 방식을 쓴다.
function bindScatterTip(svg){const tip=$('#scatter-tip'),wrap=svg.parentElement;if(!tip)return;svg.querySelectorAll('circle.dot').forEach(el=>{el.onmousemove=e=>{const [nm,xv,cnt,tr]=el.dataset.tip.split('|');const rc=wrap.getBoundingClientRect();tip.style.display='block';const lx=e.clientX-rc.left,ly=e.clientY-rc.top;tip.style.left=Math.min(lx+14,rc.width-190)+'px';tip.style.top=(ly+14)+'px';tip.innerHTML=`<b>${nm}</b><br>${state.xvar==='fed_bloc'?'블록':'ideal point'} ${xv}<br>피영향 ${cnt}건<br>${state.sizevar==='gdp_usd'?'GDP':'무역비중'} ${tr}`};el.onmouseleave=()=>{tip.style.display='none'}})}
function renderRegTable(list){let html='<thead><tr><th>시행국</th><th>n</th><th>r</th><th>p</th><th>유의성</th><th title="ln(무역비중)을 통제한 편상관, df=n-3">r (무역비중 통제)</th></tr></thead><tbody>';for(const s of list){const p=s.fit?pValue(s.fit.r,s.n):null;const st=stars(p);const pp=s.partial?pValue(s.partial.r,s.partial.n,s.partial.n-3):null;const pst=stars(pp);html+=`<tr><td>${esc(s.label)}</td><td>${s.n}</td><td>${s.fit?s.fit.r.toFixed(3):'n/a'}</td><td>${pText(p)}</td><td class="${st.cls}">${st.s}</td><td>${s.partial?`${s.partial.r.toFixed(3)} <span class="${pst.cls}">${pst.s}</span><br><span class="reg-note">n=${s.partial.n}, p ${pText(pp)}</span>`:'n/a'}</td></tr>`}html+='</tbody>';$('#regtable').innerHTML=html}
function drawScatter(){let st;if(state.xvar==='fed_bloc'){computeScatterDomain(state.xvar,state.sizevar);st=blocPanel('scatter');renderBlocTable(st)}else{computeScatterDomain(state.xvar,state.sizevar);st=scatterPanel('scatter',state.xvar);renderRegTable(st)}const lab=$('#scatter-topn-label');if(lab){if(state.topN>=200){lab.value='전체'}else{const t=st.map(o=>o.cutTrade).filter(v=>v!=null);lab.value=t.length?`${state.topN} (≥${(Math.min(...t)*100).toFixed(t[0]<.001?3:2)}%)`:String(state.topN)}}}

function bind(){const sf=$('#scatter-from'),st=$('#scatter-to');const syncRange=()=>{if(state.yearFrom>state.yearTo)[state.yearFrom,state.yearTo]=[state.yearTo,state.yearFrom];sf.value=state.yearFrom;st.value=state.yearTo;$('#scatter-from-label').value=state.yearFrom;$('#scatter-to-label').value=state.yearTo;drawScatter()};sf.oninput=()=>{state.yearFrom=+sf.value;syncRange()};st.oninput=()=>{state.yearTo=+st.value;syncRange()};const sn=$('#scatter-topn');sn.oninput=()=>{state.topN=+sn.value;drawScatter()};$('#scatter-xvar').onchange=e=>{state.xvar=e.target.value;drawScatter()};$('#scatter-sizevar').onchange=e=>{state.sizevar=e.target.value;drawScatter()};$('#scatter-targeted').onchange=e=>{state.targetedOnly=e.target.checked;drawScatter()};$('#comp-mode').onchange=e=>{state.compMode=e.target.value;drawComposition()}}
function fillMeta(){const yrs=D.years||[];$('#meta-asof').textContent=D.gta_asof||'—';$('#foot-asof').textContent=D.gta_asof||'—';const stamp=[...document.body.children].reverse().find(e=>e.matches('p.reg-note')&&/^빌드:/.test(e.textContent||''));const fb=$('#foot-build');if(stamp){fb.textContent=stamp.textContent;stamp.remove()}else if(D.built_at){fb.textContent='빌드 '+D.built_at}}
Promise.all([fetch('ip_risk.json?v=20260824',{cache:'no-store'}).then(r=>r.json()),fetch('ip_sectors.json?v=20260824',{cache:'no-store'}).then(r=>r.json())]).then(([d,s])=>{D=d;SEC=s;computeScatterDomain();bind();fillMeta();drawScatter();drawComposition()}).catch(e=>{$('.scatter-wrap').innerHTML=`<div class="empty">데이터를 불러오지 못했습니다: ${esc(e)}</div>`});
// ---- 피영향국(AJ) 블록 구성 — 두 모드 (2026-08-25) -----------------------
// 원본 D.composition은 발표연도별(비누적) 값이다. 누적 모드는 이걸 매번
// 새로 합산해서 만든다(원본을 직접 고쳐 쓰면 모드를 되돌릴 수 없다 — 이전
// 구현의 실수였다).
function drawCompositionBars(rows,titleSuffix){const svg=$('#composition');if(!svg)return;const years=D.years,panels=[['United States of America','미국'],['China','중국']];let out='';const top=70,rowH=40,barH=28,panelW=480,gap=40,left0=0,totalW=92;
 panels.forEach(([imp,label],pi)=>{const ox=left0+pi*(panelW+gap),labelW=66,barX=ox+labelW,barW=panelW-labelW-totalW;
  const rs=rows.filter(v=>v.implementer===imp);
  const mx=rs.reduce((a,r)=>Math.max(a,r.classified_count),0)||1;
  const step=pickCountStep(mx),nT=Math.max(1,Math.ceil(mx/step)),axisMax=step*nT;
  out+=`<text class="comp-title" x="${barX+barW/2}" y="28" text-anchor="middle">${label} 시행</text>`;
  for(let t=0;t<=4;t+=2){const v=Math.round(axisMax*t/4),x=barX+barW*t/4;out+=`<text class="comp-axis" x="${x}" y="62" text-anchor="${t===0?'start':t===4?'end':'middle'}">${v.toLocaleString()}</text>`}
  years.forEach((year,yi)=>{const r=rs.find(v=>v.year===year),y=top+yi*rowH;if(!r)return;out+=`<text class="comp-axis" x="${barX-10}" y="${y+21}" text-anchor="end">${year}</text>`;let x=barX;
   [['own_bloc_count',tok('--bloc-self'),'comp-label'],['nonaligned_count',tok('--bloc-neutral'),'comp-na-label'],['opposing_bloc_count',tok('--bloc-other'),'comp-label']].forEach(([ck,color,cls])=>{const w=barW*r[ck]/axisMax,group=ck==='own_bloc_count'?'자국 블록':ck==='nonaligned_count'?'비동맹':'상대 블록';out+=`<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${barH}" fill="${color}"><title>${label} ${year} · ${group} ${r[ck].toLocaleString()}건</title></rect>`;if(w>=r[ck].toLocaleString().length*12+8)out+=`<text class="${cls}" x="${(x+w/2).toFixed(1)}" y="${y+21}" text-anchor="middle">${r[ck].toLocaleString()}</text>`;x+=w});
   out+=`<text class="comp-axis" x="${(x+8).toFixed(1)}" y="${y+21}">${r.classified_count.toLocaleString()}${year===2026?'*':''}</text>`})});
 svg.innerHTML=out}
function drawComposition(){if(!D||!D.composition||!D.composition_annual)return;const mode=state.compMode;const rows=mode==='cumulative'?D.composition:D.composition_annual;drawCompositionBars(rows,'');
 const notes=[['United States of America','미국'],['China','중국']].map(([imp,label])=>{const rs=rows.filter(r=>r.implementer===imp);
  if(mode==='cumulative'){const last=rs.slice().sort((a,b)=>a.year-b.year).at(-1);if(!last)return `${label}: 자료 없음`;return `${label} ${last.year}년: ${last.classified_count.toLocaleString()}건 (BSV 없는 국가 ${last.excluded_count.toLocaleString()}건 제외)`}
  const all=rs.reduce((s,r)=>s+r.all_aj_count,0),ex=rs.reduce((s,r)=>s+r.excluded_count,0),cl=rs.reduce((s,r)=>s+r.classified_count,0);return `${label} 합계: ${cl.toLocaleString()}건 (BSV 없는 국가 ${ex.toLocaleString()}건 제외)`});
 $('#composition-note').textContent=(mode==='cumulative'?'그해 12/31에 유효했던 조치 기준. ':'그해 발표된 조치 기준. ')+notes.join(' · ')+' · *2026년은 부분연도'}
</script></body></html>
